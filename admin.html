<!DOCTYPE html>
<html>
<head>
<title>Roomio Admin</title>
</head>
<body style="background:#0f172a;font-family:Arial;">
<div style="max-width:600px;margin:20px auto;background:white;padding:25px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,0.2);">
<img src="logo.png" style="height:80px;">
<h2 style="color:#0f172a;">ROOMIO ADMIN PANEL</h2>
</center>
<style>
input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ddd;
border-radius:8px;
}

button{
width:100%;
padding:12px;
background:#16a34a;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}
</style>


<input id="hotelName" type="text" placeholder="Hotel Name">

<input id="location" type="text" placeholder="Location">

<input id="price" type="number" placeholder="Price">

<input id="whatsapp" type="text" placeholder="WhatsApp Number">

<input id="image" type="text" placeholder="Hotel Image URL">

<button onclick="addHotel()">Add Hotel</button>
</div>
<script>

function addHotel(){

let hotel = {
name: document.getElementById("hotelName").value,
location: document.getElementById("location").value,
price: document.getElementById("price").value,
whatsapp: document.getElementById("whatsapp").value,
image: document.getElementById("image").value
};

localStorage.setItem("roomioHotel", JSON.stringify(hotel));

alert("Hotel Saved Successfully!");

}

</script>
