<!DOCTYPE html>
<html>
<head>
  <title>Roomio Hotels</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
    }

    .hero {
      height: 100vh;
      background: url('https://images.unsplash.com/photo-1542314831-068cd1dbfeeb') center/cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
    }

    .hero h1 {
      font-size: 55px;
      margin: 0;
      text-shadow: 2px 2px 10px black;
    }

    .hero p {
      font-size: 20px;
      margin-top: 10px;
      color: #f1f1f1;
    }

    .btn {
      margin-top: 20px;
      padding: 14px 28px;
      background: gold;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background: orange;
    }
  </style>
</head>

<body>

  <div class="hero">
    <h1>Welcome to Roomio Hotels 🏨</h1>
    <p>Luxury | Comfort | Best Price Stay</p>

    <button class="btn" onclick="bookNow()">Book Now</button>
  </div>

  <script>
    function bookNow() {
      let phone = "919876543210"; 
      let msg = "Hi, I want to book a room in Roomio Hotels";
      let url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(msg);
      window.open(url, "_blank");
    }
  </script>

</body>
</html>
