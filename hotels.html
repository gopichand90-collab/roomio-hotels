<!DOCTYPE html>
<html>
<head>
<title>Roomio Hotels</title>
<style>
body{
font-family:Arial;
background:#f5f5f5;
padding:20px;
}

.card{
max-width:400px;
margin:20px auto;
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.card img{
width:100%;
border-radius:10px;
}

button{
background:#0f172a;
color:white;
border:none;
padding:10px 20px;
border-radius:6px;
cursor:pointer;
}
</style>
</head>
<body>

<h1 align="center">ROOMIO HOTELS</h1>

<div class="card">
<img id="hotelImage">

<h2 id="hotelName"></h2>

<p id="hotelLocation"></p>

<p id="hotelPrice"></p>

<button>Book Now</button>
</div>

<script>

let hotel = JSON.parse(localStorage.getItem("roomioHotel"));

if(hotel){

document.getElementById("hotelImage").src = hotel.image;

document.getElementById("hotelName").innerText = hotel.name;

document.getElementById("hotelLocation").innerText =
"Location : " + hotel.location;

document.getElementById("hotelPrice").innerText =
"Price : ₹" + hotel.price;

}

</script>

</body>
</html>
