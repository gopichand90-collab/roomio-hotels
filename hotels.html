<script>

let hotels = JSON.parse(localStorage.getItem("roomioHotels")) || [];

let cards = "";

hotels.forEach(hotel => {

cards += `
<div class="card">
<img src="${hotel.image}">
<h2>${hotel.name}</h2>
<p>Location : ${hotel.location}</p>
<p>Price : ₹${hotel.price}</p>
<button>Book Now</button>
</div>
`;

});

document.body.innerHTML =
'<h1 align="center">ROOMIO HOTELS</h1>' + cards;

</script>
